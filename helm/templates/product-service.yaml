apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: product
spec:
  type: {{ .Values.product.service.type }}

  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: product

  ports:
    - name: http
      port: {{ .Values.product.service.port }}
      targetPort: http
      protocol: TCP
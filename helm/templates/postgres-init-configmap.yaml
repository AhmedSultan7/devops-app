apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}

  init.sh: |
    #!/bin/sh
    set -eu

    psql \
      --username "$POSTGRES_USER" \
      --dbname postgres \
      --set=ON_ERROR_STOP=1 \
      --set=shop_password="$SHOP_PASSWORD" \
      --file=/bootstrap/init.sql
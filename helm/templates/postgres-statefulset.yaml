apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: mini-ecommerce-postgres

  template:
    metadata:
      labels:
        app: mini-ecommerce-postgres

    spec:
      automountServiceAccountToken: false

      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_DB
              value: postgres

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            - name: SHOP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: SHOP_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U postgres -d postgres
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

            - name: initialization
              mountPath: /bootstrap
              readOnly: true

            - name: initialization
              mountPath: /docker-entrypoint-initdb.d/01-init.sh
              subPath: init.sh
              readOnly: true

      volumes:
        - name: initialization
          configMap:
            name: postgres-init

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
# For public Docker Hub repositories:
imagePullSecrets: []


frontend:
  replicaCount: 1

  image:
    repository: soltanahmed1960/devops-app-frontend
    tag: "latest"
    pullPolicy: Always

  service:
    type: NodePort
    port: 8080
    targetPort: 8080

  env:
    PRODUCT_SERVICE_URL: "http://product-service:3001"
    ORDER_SERVICE_URL: "http://order-service:3002"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

order:
  replicaCount: 1

  image:
    repository: soltanahmed1960/devops-app-order
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3002
    targetPort: 3002

  env:
    NODE_ENV: "production"
    PORT: "3002"
    PRODUCT_SERVICE_URL: "http://product-service:3001"

  existingSecret: order-service-env

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

product:
  replicaCount: 1

  image:
    repository: soltanahmed1960/devops-app-product
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  env:
    NODE_ENV: "production"
    PORT: "3001"

  existingSecret: product-service-env

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
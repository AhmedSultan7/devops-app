apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: product
spec:
  replicas: {{ .Values.product.replicaCount }}

  selector:
    matchLabels:
      {{- include "my-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: product

  template:
    metadata:
      labels:
        {{- include "my-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: product

    spec:
      automountServiceAccountToken: false

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: product-service
          image: "{{ .Values.product.image.repository }}:{{ .Values.product.image.tag }}"
          imagePullPolicy: {{ .Values.product.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.product.service.targetPort }}

          env:
            {{- range $name, $value := .Values.product.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}

          {{- with .Values.product.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

          resources:
            {{- toYaml .Values.product.resources | nindent 12 }}